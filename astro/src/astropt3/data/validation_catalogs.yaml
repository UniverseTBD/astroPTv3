# Fixed source revisions and anchor mix for the ladder's validation panel.
# Changes here define a new panel; do not mix its curves with the old one.
split: validation
min_catalogs: 3
partitions_per_chunk: 1
# Dask's auto limit (RAM / cores) pauses this one-thread worker mid-load.
worker_memory_limit: 64GiB
anchors:
  - name: legacy
    draw_weight: 1
    repo: >-
      UniverseTBD/mmu_ssl_legacysurvey_north@f634744d3c44dd4fde0dee3172d4887c5e3c31c0
    decoder: legacy_image
    record_key: image
    scalar_columns:
      ebv: ebv
      flux_g: flux_g
      flux_r: flux_r
      flux_z: flux_z
      fiberflux_g: fiberflux_g
      fiberflux_r: fiberflux_r
      fiberflux_z: fiberflux_z
      psfdepth_g: psfdepth_g
      psfdepth_r: psfdepth_r
      psfdepth_z: psfdepth_z
  - name: legacy_south
    draw_weight: 1
    repo: >-
      hugging-science/mmu_legacysurvey_dr10_south_21@982f321784d8daf2a5f983eb3ec560f31b90d667
    decoder: legacy_south_image
    record_key: legacy_south_image
    scalar_columns:
      legacy_south_ebv: EBV
      legacy_south_flux_g: FLUX_G
      legacy_south_flux_r: FLUX_R
      legacy_south_flux_i: FLUX_I
      legacy_south_flux_z: FLUX_Z
catalogs:
  - name: sdss
    repo: UniverseTBD/mmu_sdss_dr17@091f56aa923837b7672586f6076fda490a6062dc
    decoder: sdss_spectrum
    record_key: spectrum_sdss
    scalar_columns:
      sdss_Z: Z
      sdss_ZWARNING: ZWARNING
      sdss_VDISP: VDISP
  - name: desi
    repo: >-
      hugging-science/mmu_desi_DR1@561be75c6fa84104205962a18034a8d53124fecf
    decoder: desi_spectrum
    record_key: spectrum
    scalar_columns:
      Z: Z
      # DR1's boolean ZWARN is inverted (True when bits == 0); gate Z on the raw bitmask.
      ZWARN: ZWARN_BITS
  - name: hsc
    repo: >-
      hugging-science/mmu_hsc_pdr3_wide_21@7de6b92fd99097207a00b9c42f2d2862d62662bf
    decoder: hsc_image
    record_key: hsc_image
    scalar_columns:
      hsc_g_cmodel_mag: g_cmodel_mag
      hsc_r_cmodel_mag: r_cmodel_mag
      hsc_i_cmodel_mag: i_cmodel_mag
      hsc_z_cmodel_mag: z_cmodel_mag
      hsc_y_cmodel_mag: y_cmodel_mag
      hsc_g_cmodel_magerr: g_cmodel_magerr
      hsc_r_cmodel_magerr: r_cmodel_magerr
      hsc_i_cmodel_magerr: i_cmodel_magerr
      hsc_z_cmodel_magerr: z_cmodel_magerr
      hsc_y_cmodel_magerr: y_cmodel_magerr
      hsc_i_sdssshape_shape11: i_sdssshape_shape11
      hsc_i_sdssshape_shape22: i_sdssshape_shape22
      hsc_i_sdssshape_shape12: i_sdssshape_shape12
      hsc_i_sdssshape_psf_shape11: i_sdssshape_psf_shape11
      hsc_i_sdssshape_psf_shape22: i_sdssshape_psf_shape22
      hsc_i_sdssshape_psf_shape12: i_sdssshape_psf_shape12
  - name: galaxies
    repo: >-
      Smith42/galaxies-with-hats@1a2b1ebbbe06c67a15f49385643ab711c5824a0d/train
    decoder: rgb_png
    record_key: galaxy_image
    scalar_columns:
      gwh_redshift: redshift
      gwh_mass_med_photoz: mass_med_photoz
      gwh_total_sfr_median: total_sfr_median
      gwh_total_sfr_flag: total_sfr_flag
      gwh_total_ssfr_median: total_ssfr_median
      gwh_total_ssfr_flag: total_ssfr_flag
      gwh_smooth-or-featured_smooth_fraction: smooth-or-featured_smooth_fraction
      gwh_smooth-or-featured_featured-or-disk_fraction: >-
        smooth-or-featured_featured-or-disk_fraction
      gwh_disk-edge-on_yes_fraction: disk-edge-on_yes_fraction
      gwh_has-spiral-arms_yes_fraction: has-spiral-arms_yes_fraction
      gwh_bar_strong_fraction: bar_strong_fraction
      gwh_bar_weak_fraction: bar_weak_fraction
      gwh_bulge-size_dominant_fraction: bulge-size_dominant_fraction
      gwh_bulge-size_large_fraction: bulge-size_large_fraction
      gwh_bulge-size_moderate_fraction: bulge-size_moderate_fraction
      gwh_bulge-size_small_fraction: bulge-size_small_fraction
      gwh_how-rounded_round_fraction: how-rounded_round_fraction
      gwh_how-rounded_in-between_fraction: how-rounded_in-between_fraction
      gwh_edge-on-bulge_boxy_fraction: edge-on-bulge_boxy_fraction
      gwh_edge-on-bulge_rounded_fraction: edge-on-bulge_rounded_fraction
      gwh_spiral-winding_tight_fraction: spiral-winding_tight_fraction
      gwh_spiral-winding_medium_fraction: spiral-winding_medium_fraction
      gwh_spiral-arm-count_1_fraction: spiral-arm-count_1_fraction
      gwh_spiral-arm-count_2_fraction: spiral-arm-count_2_fraction
      gwh_spiral-arm-count_3_fraction: spiral-arm-count_3_fraction
      gwh_spiral-arm-count_4_fraction: spiral-arm-count_4_fraction
      gwh_spiral-arm-count_more-than-4_fraction: >-
        spiral-arm-count_more-than-4_fraction
      gwh_merging_minor-disturbance_fraction: merging_minor-disturbance_fraction
      gwh_merging_major-disturbance_fraction: merging_major-disturbance_fraction
      gwh_merging_merger_fraction: merging_merger_fraction
      gwh_est_petro_th50: est_petro_th50
      gwh_sersic_n: sersic_n
      gwh_sersic_ba: sersic_ba
      gwh_petro_th50: petro_th50
      gwh_petro_th90: petro_th90
      gwh_petro_ba50: petro_ba50
      gwh_petro_ba90: petro_ba90
      gwh_mag_f: mag_f
      gwh_mag_n: mag_n
      gwh_mag_u: mag_u
      gwh_mag_i: mag_i
      gwh_logMH: logMH
      gwh_W50: W50
      gwh_fibre_sfr_median: fibre_sfr_median
      gwh_fibre_ssfr_median: fibre_ssfr_median
      gwh_ssfr_med_photoz: ssfr_med_photoz
  - name: provabgs
    repo: UniverseTBD/mmu_desi_provabgs@a50ea5c2baacfea8d88c48baf78bd9c507c2f525
    decoder: scalars
    how: left
    scalar_columns:
      provabgs_LOG_MSTAR: LOG_MSTAR
      provabgs_Z_MW: Z_MW
      provabgs_TAGE_MW: TAGE_MW
      provabgs_AVG_SFR: AVG_SFR
      provabgs_MAG_W1: MAG_W1
