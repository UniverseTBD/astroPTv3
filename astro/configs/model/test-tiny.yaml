# Tiny config for CPU tests and smoke runs only
name: test-tiny
nominal_params: null
hidden_size: 64
num_hidden_layers: 2
num_attention_heads: 4
num_key_value_heads: 2
intermediate_size: 128
max_position_embeddings: 4096
rope_theta: 100000.0
no_rope_layer_interval: 4
spiral: true # center-outward image patch order (ADR 0004)
# smaller than the recipe flow to keep the tiny model tiny
jetformer_flow_steps: 2
jetformer_flow_hidden: 16
jetformer_flow_depth: 1
jetformer_flow_heads: 2
