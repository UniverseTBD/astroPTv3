# AstroPT3 410m — Pythia-mirrored size, SmolLM3 architecture (GQA, NoPE/4)
name: astropt3-410m
nominal_params: 410000000
hidden_size: 1024
num_hidden_layers: 27
num_attention_heads: 16
num_key_value_heads: 4
intermediate_size: 4096
