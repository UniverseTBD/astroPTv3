                gwh_spiral-arm-count_4_fraction: spiral-arm-count_4_fraction
                gwh_spiral-arm-count_more-than-4_fraction: spiral-arm-count_more-than-4_fraction
                gwh_merging_minor-disturbance_fraction: merging_minor-disturbance_fraction
                gwh_merging_major-disturbance_fraction: merging_major-disturbance_fraction
                gwh_merging_merger_fraction: merging_merger_fraction
                gwh_est_petro_th50: est_petro_th50
                gwh_sersic_n: sersic_n
                gwh_sersic_ba: sersic_ba
                gwh_petro_th50: petro_th50
                gwh_petro_th90: petro_th90
                gwh_petro_ba50: petro_ba50
                gwh_petro_ba90: petro_ba90
                gwh_mag_f: mag_f
                gwh_mag_n: mag_n
                gwh_mag_u: mag_u
                gwh_mag_i: mag_i
                gwh_logMH: logMH
