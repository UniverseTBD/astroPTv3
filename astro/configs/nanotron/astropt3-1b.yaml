            - name: provabgs
              repo: >-
                UniverseTBD/mmu_desi_provabgs@a50ea5c2baacfea8d88c48baf78bd9c507c2f525
              decoder: scalars
              how: left # decorates anchored objects; scalar-only rows would be label-only objects
              scalar_columns:
                provabgs_LOG_MSTAR: LOG_MSTAR
                provabgs_Z_MW: Z_MW
                provabgs_TAGE_MW: TAGE_MW
                provabgs_AVG_SFR: AVG_SFR
                provabgs_MAG_W1: MAG_W1
          how: outer
          min_catalogs: 3
          radius_arcsec: 1.0
          partitions_per_chunk: 4
          worker_memory_limit: 64GiB
      seed: 42
      # Each worker owns a catalog stream; size for available CPU/RAM.
