# AstroPT3 410M multimodal pretraining (Pythia-mirrored size; recipe: 32 GPUs,
# TP=1, DP=32, ZeRO-1 — see astro/EXPERIMENTS.md Part I parallelism table).
#
#   sbatch --nodes=4 astro/scripts/launch_slurm.sbatch \
#       astro/configs/nanotron/astropt3-410m.yaml
#
# GBS = dp(32) x mbs(16) x acc(1) x seq(4096) = 2.10M tokens/step.
# Dry-run 100 steps at the target topology first (see the sbatch header).
# For a smaller box, scale `parallelism.dp` down and
# `batch_accumulation_per_replica` up to keep GBS.
# TP=1 sizes also run on one GPU: astro/scripts/run_train.bash sets DP=1.
general:
  project: astropt3
  run: astropt3-410m
  seed: 42
  step: null
  consumed_train_samples: null
  benchmark_csv_path: null
  # must stay true: flattened modality tensors differ in shape across DP
  # ranks, which the DP input sanity check cannot handle
  ignore_sanity_checks: true
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    std: 0.02
  make_vocab_size_divisible_by: 1
  model_config:
    is_astropt3_config: true
    # JetFormer flow; width = min(hidden_size // 4, 512) (docs/jetformer-flow.md)
    jetformer_flow_steps: 8
    jetformer_flow_hidden: 256
    jetformer_flow_depth: 4
    jetformer_flow_heads: 8
    modalities:
      - name: images
        family: image
        source: legacy
        record_keys: [image]
        token_ids: [2, 3, 4]
        input_size: 192
        patch_size: 8
        pos_type: index
        pos_input_size: 1
        max_positions: 361
      - name: spectra
        family: spectrum
        source: desi
        record_keys: [spectrum]
        token_ids: [5, 6, 7]
        input_size: 256
        patch_size: 256
        pos_type: continuous
        pos_input_size: 1
        max_positions: 1024
      - name: sdss_spectra
        family: spectrum
        source: sdss
        record_keys: [spectrum_sdss]
        token_ids: [17, 18, 19]
        input_size: 256
        patch_size: 256
        pos_type: continuous
        pos_input_size: 1
        max_positions: 1024
      - name: hsc_images
        family: image
        source: hsc
        record_keys: [hsc_image]
        token_ids: [20, 21, 22]
        input_size: 320
        patch_size: 8
        pos_type: index
        pos_input_size: 1
        max_positions: 144
      - name: galaxies
        family: image
        source: galaxies_with_hats
        record_keys: [galaxy_image]
        token_ids: [23, 24, 25]
        input_size: 768 # 16 * 16 * 3: 8-bit RGB PNG scaled to [0, 1]
        patch_size: 16
        pos_type: index
        pos_input_size: 1
        max_positions: 256 # whole 256x256 image, (256 / 16)^2 patches
        image_crop: 0 # keep the whole image (the galaxy fills the frame)
      - name: gwh_redshift
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_redshift]
        token_ids: [26, 27, 28]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_mass_med_photoz
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_mass_med_photoz]
        token_ids: [29, 30, 31]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_total_sfr_median
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_total_sfr_median]
        token_ids: [32, 33, 34]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_total_ssfr_median
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_total_ssfr_median]
        token_ids: [35, 36, 37]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_smooth-or-featured_smooth_fraction
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_smooth-or-featured_smooth_fraction]
        token_ids: [38, 39, 40]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_smooth-or-featured_featured-or-disk_fraction
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_smooth-or-featured_featured-or-disk_fraction]
        token_ids: [41, 42, 43]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_disk-edge-on_yes_fraction
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_disk-edge-on_yes_fraction]
        token_ids: [44, 45, 46]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_has-spiral-arms_yes_fraction
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_has-spiral-arms_yes_fraction]
        token_ids: [47, 48, 49]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: gwh_merging_merger_fraction
        family: scalar
        source: galaxies_with_hats
        record_keys: [gwh_merging_merger_fraction]
        token_ids: [50, 51, 52]
        input_size: 1
        patch_size: 1
        pos_type: index
        max_positions: 1
      - name: legacy_south_images
        family: image
        source: legacy_south
        record_keys: [legacy_south_image]
        token_ids: [53, 54, 55]
        input_size: 256
        patch_size: 8
        image_crop: 96
        pos_type: index
        max_positions: 144
    spiral: true # center-outward image patch order (ADR 0004)
    hidden_size: 1024
    num_hidden_layers: 27
    num_attention_heads: 16
    num_key_value_heads: 4
    intermediate_size: 4096
    max_position_embeddings: 4096
    rope_theta: 100000.0
    no_rope_layer: 4
    rms_norm_eps: 1.0e-06
    rope_interleaved: false
    hidden_act: silu
    attention_bias: false
    initializer_range: 0.02
    vocab_size: 64
    pad_token_id: 0
    bos_token_id: 1
    eos_token_id: 1
    tie_word_embeddings: false
    use_cache: false
    _attn_implementation: flash_attention_2
    _use_qkv_packed: true
    _use_doc_masking: true
    _fused_rms_norm: true
    _fused_rotary_emb: true
    log_attn_probs: false
parallelism:
  dp: 32
  pp: 1 # PP=1 everywhere by design
  tp: 1
  context_parallel_size: 1
  expert_parallel_size: 1
  pp_engine: 1f1b
  tp_mode: ALL_REDUCE # required: modality modules are TP-replicated
  tp_linear_async_communication: false
  recompute_layer: true # the 410M flows only fit one GPU's per-rank workload with it
data_stages:
  - name: multimodal
    start_training_step: 1
    data:
      dataset:
        is_astropt3_streaming: true
        echo_factor: 4
        catalog_stream:
          split: train
          # Priority order; weights count LSDB draws, not objects or tokens.
          anchors:
            - name: legacy
              draw_weight: 1
              repo: >-
                UniverseTBD/mmu_ssl_legacysurvey_north@f634744d3c44dd4fde0dee3172d4887c5e3c31c0
              decoder: legacy_image
              record_key: image
            - name: legacy_south
              draw_weight: 2
              repo: >-
                hugging-science/mmu_legacysurvey_dr10_south_21@982f321784d8daf2a5f983eb3ec560f31b90d667
              decoder: legacy_south_image
              record_key: legacy_south_image
          catalogs:
            - name: sdss
              repo: >-
                UniverseTBD/mmu_sdss_sdss@da175ca9bb931f4301ab950431922ba9f99089ba
              decoder: sdss_spectrum
              record_key: spectrum_sdss
            - name: desi
              repo: >-
                UniverseTBD/mmu_desi_edr_sv3@9fd88ba48233cb9857701ce802a7eade2d4c4a88
              decoder: desi_spectrum
              record_key: spectrum
            - name: hsc
              repo: >-
                hugging-science/mmu_hsc_pdr3_wide_21@7de6b92fd99097207a00b9c42f2d2862d62662bf
              decoder: hsc_image
              record_key: hsc_image
            - name: galaxies
              repo: >-
                Smith42/galaxies-with-hats@c0188b776c4ce6312a805a04cbc25c891a075933/train
              decoder: rgb_png
              record_key: galaxy_image
              how: left # no HATS margin cache, which outer joins require
              scalar_columns:
                gwh_redshift: redshift
                gwh_mass_med_photoz: mass_med_photoz
                gwh_total_sfr_median: total_sfr_median
                gwh_total_ssfr_median: total_ssfr_median
                gwh_smooth-or-featured_smooth_fraction: smooth-or-featured_smooth_fraction
                gwh_smooth-or-featured_featured-or-disk_fraction: smooth-or-featured_featured-or-disk_fraction
                gwh_disk-edge-on_yes_fraction: disk-edge-on_yes_fraction
                gwh_has-spiral-arms_yes_fraction: has-spiral-arms_yes_fraction
                gwh_merging_merger_fraction: merging_merger_fraction
          how: outer
          min_catalogs: 3
          radius_arcsec: 1.0
          partitions_per_chunk: 4
          worker_memory_limit: 64GiB
      seed: 42
      # Each worker owns a catalog stream; size for available CPU/RAM.
      num_loading_workers: 8
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.0003 # Pythia 410M peak LR
    lr_warmup_steps: 2000 # min(2000, 1% of train_steps)
    lr_warmup_style: linear
    lr_decay_style: cosine # cosine to 0.1x peak
    lr_decay_steps: null # defaults to train_steps - warmup
    lr_decay_starting_step: null
    min_decay_lr: 0.00003
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.1 # on >=2D params; norms excluded below
  weight_decay_exclude_named_params:
    - .*layernorm.*
    - .*layer_norm.*
  zero_stage: 1
tokens:
  sequence_length: 4096
  train_steps:
    10000 # placeholder ~21B tokens (~4 pilot epochs);
    # token budget finalized at launch (Phase 5)
  micro_batch_size: 16
  batch_accumulation_per_replica: 1
  val_check_interval: 100
  limit_val_batches: 0 # eval never runs in the trainer (ADR 0015 defers
  limit_test_batches: 0 # source-backed val/probe sweeps)
checkpoints:
  checkpoints_path: ../astroPTv3_checkpoints/astropt3-410m-dual-anchor
  checkpoint_schedule: pythia # steps 1,2,4,...,512 + every interval
  checkpoint_interval: 1000
  save_initial_state: false
  save_final_state: true
tokenizer:
  tokenizer_name_or_path: null
profiler: null
